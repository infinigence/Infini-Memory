[project]
name = "infini-memory"
dynamic = ["version"]
description = "A lightweight, scalable persistent memory system for LLM applications and long-term interactive agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
keywords = ["memory", "llm", "ai", "agent", "rag", "long-term-memory", "personalization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "langchain",
  "langfuse",
  "numpy",
  "openai>=1.0",
  "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/infinigence/Infini-Memory"
Repository = "https://github.com/infinigence/Infini-Memory"
Issues = "https://github.com/infinigence/Infini-Memory/issues"

[build-system]
requires = [
  "setuptools>=69",
  "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s | %(levelname)s | %(name)s | %(filename)s:%(lineno)d | %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
